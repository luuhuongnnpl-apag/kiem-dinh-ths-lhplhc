<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSDL minh chứng – TĐG CTĐT ThS Luật HP&amp;LHC</title>
<style>
  :root{--navy:#1F3864;--blue:#2E5597;--pale:#EEF3FB;--line:#D5DCE8;--ink:#1d2433;--mute:#5f6b7f;--ok:#2e7d4f;--warn:#b26a00;--bad:#b3261e;--dk:#FCE4D6}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f6f8fb}
  header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:260px}
  header small{opacity:.8;font-weight:400;display:block;font-size:12px}
  .who{font-size:13px;opacity:.9}
  nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;flex-wrap:wrap;align-items:center}
  nav button{border:0;background:none;padding:11px 14px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
  nav button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
  nav input{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;width:260px;max-width:100%}
  main{display:flex;min-height:calc(100vh - 110px)}
  aside{width:290px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 110px);position:sticky;top:0}
  aside .std{padding:8px 12px;font-weight:600;color:var(--navy);background:var(--pale);border-top:1px solid var(--line);font-size:13px}
  aside a{display:flex;gap:8px;padding:6px 12px 6px 18px;color:var(--ink);text-decoration:none;font-size:13px;cursor:pointer;align-items:baseline}
  aside a:hover{background:#f3f6fb} aside a.on{background:#dfe8f7;font-weight:600} aside a.std{padding-left:12px} aside a.std.on{background:#c9d8f0}
  aside a .n{flex:1} aside a .p{font-size:11px;color:var(--mute);white-space:nowrap}
  .badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--dk);color:#8a3b00;font-weight:600;white-space:nowrap}
  section.content{flex:1;padding:18px 22px;overflow:auto;min-width:0}
  h2{font-size:18px;margin:0 0 6px;color:var(--navy)} h3{font-size:15px;color:var(--navy);margin:18px 0 6px}
  .meta{color:var(--mute);font-size:13px;margin-bottom:10px}
  details{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px}
  details summary{cursor:pointer;font-weight:600;color:var(--blue)}
  details ol,details ul{margin:6px 0 2px;padding-left:22px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:13.5px}
  th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-weight:600}
  td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
  tr.mc td{background:var(--pale)} tr.mc td.ma{font-weight:700;color:var(--navy);white-space:nowrap}
  tr.tp td.ten{padding-left:26px} tr.tp td.ten:before{content:"↳ ";color:var(--mute)}
  tr.bo td{opacity:.5}
  .st{font-size:12px;padding:1px 7px;border-radius:9px;white-space:nowrap;display:inline-block}
  .st0{background:#eceff3;color:#55606f}.st1{background:#fff3d6;color:var(--warn)}.st2{background:#dcf2e4;color:var(--ok)}.st3{background:#fde3e1;color:var(--bad)}.st4{background:#eee;color:#888}
  .act{display:flex;gap:4px;flex-wrap:wrap}
  button.b{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  button.b:hover{background:var(--pale)} button.b.pri{background:var(--blue);color:#fff} button.b.red{border-color:var(--bad);color:var(--bad)}
  button.b:disabled{opacity:.5;cursor:default}
  a.f{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap} a.f:hover{text-decoration:underline}
  .note{font-size:12px;color:var(--bad);margin-top:2px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .card b{color:var(--navy)} .bar{height:7px;background:#e6eaf0;border-radius:4px;margin:6px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
  .login{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
  input[type=text],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
  .modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:6vh;z-index:9}
  .box{background:#fff;border-radius:10px;padding:18px 20px;width:560px;max-width:94vw;max-height:88vh;overflow:auto}
  .box h3{margin:0 0 4px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  .busy{position:fixed;bottom:16px;right:16px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:10;max-width:90vw}
  .hit{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
  .hit:hover{border-color:var(--blue)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
  .ok{color:var(--ok);font-weight:600} .no{color:var(--bad);font-weight:600}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;background:#fafcff;cursor:pointer;margin-top:6px}
  .drop:hover,.drop.on{border-color:var(--blue);background:var(--pale)}
  @media(max-width:800px){main{display:block}aside{width:auto;max-height:240px;position:static}}
</style>
</head>
<body>
<div id="app"><div class="login">Đang tải…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="vanban.js"></script>
<script src="app.js"></script>
</body>
</html>
